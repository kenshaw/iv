name: Announce Release
# The Homebrew and AUR workflows bump the formula and the packages on a
# schedule (D52, D66). This workflow only announces the release.
on:
  release:
    types: [published]
env:
  APP: iv
  VER: ${{ github.ref_name }}
  REPO: ${{ github.repository }}

jobs:
  announce-discord:
    name: Announce Discord
    runs-on: ubuntu-latest
    steps:
      - name: Announce Discord
        run: |
          curl \
            -H 'Content-Type: application/json' \
            -d '{"username": "'$APP'", "content": "> *'$APP' '$VER'* has been released!\n\nGet it here: https://github.com/'$REPO'/releases/'$VER'"}' \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
