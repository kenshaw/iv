name: Release
# a release builds the binaries on seven runners, so it runs only for a pushed
# version tag, and not for each push. The Test workflow tests each push (D53)
on:
  push:
    tags:
      - 'v*'
env:
  APP: iv
  VER: ${{ github.ref_name }}
  GO_VERSION: stable

jobs:
  build_for_linux:
    name: Build for Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 26.04 rather than 24.04 (ubuntu-latest): libvips needed 8.18, which
        # 24.04 does not have. libvips is gone (D56), and 24.04 is untested
        # since (see docs/BACKLOG.md)
        include:
          - arch: amd64
            os: ubuntu-26.04
          - arch: arm64
            os: ubuntu-26.04-arm
    steps:
      # blitz is the only C code, and it links fontconfig and freetype
      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y \
            build-essential \
            file \
            libfontconfig-dev \
            libfreetype-dev
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build ${{ matrix.arch }}
        run: |
          ./build.sh -v $VER -a ${{ matrix.arch }}
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.arch }}
          path: build/linux/**/*
          if-no-files-found: error

  build_for_macos:
    name: Build for macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # each arch builds natively, with the C compiler of its runner, for
        # the archives of blitz
        include:
          - arch: amd64
            os: macos-15-intel
          - arch: arm64
            os: macos-latest
    steps:
      # build.sh packs with gtar and reports with sha256sum, neither of which
      # macos ships. blitz links only the frameworks of macOS
      - name: Install build dependencies
        run: |
          brew install --quiet coreutils gnu-tar
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build ${{ matrix.arch }}
        run: |
          ./build.sh -v $VER -a ${{ matrix.arch }}
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-darwin-${{ matrix.arch }}
          path: build/darwin/**/*
          if-no-files-found: error

  build_for_macos_universal:
    name: Build for macOS (universal)
    needs:
      - build_for_macos
    runs-on: macos-latest
    steps:
      - name: Install build dependencies
        run: |
          brew install --quiet coreutils gnu-tar
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Build universal
        run: |
          export WORKDIR=$PWD/build/darwin/universal/${VER#v}
          mkdir -p $WORKDIR

          gtar -jxvf dist-darwin-amd64/*/*/*.tar.bz2 -C $WORKDIR $APP
          gtar -jxvf dist-darwin-amd64/*/*/*.tar.bz2 -C $WORKDIR LICENSE
          mv $WORKDIR/$APP $WORKDIR/$APP-amd64

          gtar -jxvf dist-darwin-arm64/*/*/*.tar.bz2 -C $WORKDIR $APP
          mv $WORKDIR/$APP $WORKDIR/$APP-arm64

          file $WORKDIR/$APP-{amd64,arm64}

          lipo -create -output $WORKDIR/$APP $WORKDIR/$APP-amd64 $WORKDIR/$APP-arm64
          chmod +x $WORKDIR/$APP
          file $WORKDIR/$APP

          rm $WORKDIR/$APP-{amd64,arm64}

          sudo /usr/sbin/purge

          gtar -C $WORKDIR -cjf $WORKDIR/$APP-${VER#v}-darwin-universal.tar.bz2 $APP LICENSE
          ls -alh $WORKDIR/*
          sha256sum $WORKDIR/*
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-darwin-universal
          path: build/darwin/**/*
          if-no-files-found: error

  build_for_windows:
    name: Build for Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: 'msys2 {0}'
    steps:
      # UCRT64 rather than MINGW64: the mupdf of go-fitz called
      # __intrinsic_setjmpex, which only ucrt has. go-fitz is gone, and
      # MINGW64 is untested since (see docs/BACKLOG.md). build.sh packs with zip
      - name: Install build dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # keep the runner's PATH so the Go installed below stays visible
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            zip
            unzip
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build amd64
        run: |
          ./build.sh -v $VER
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: build/windows/**/*
          if-no-files-found: error

  release:
    name: Draft Release
    needs:
      - build_for_linux
      - build_for_macos
      - build_for_macos_universal
      - build_for_windows
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.APP }} ${{ env.VER }}
          draft: true
          generate_release_notes: true
          files: |
            dist-*/*/*/*.tar.bz2
            dist-*/*/*/*.zip
