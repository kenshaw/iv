name: Test
on: [push, pull_request]

permissions:
  contents: read

env:
  GO_VERSION: stable
  CGO_ENABLED: '1'
  # libvips' pkg-config cflags include -Xpreprocessor on macOS
  CGO_CFLAGS_ALLOW: '-Xpreprocessor'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 26.04 rather than 24.04 (ubuntu-latest): vipsgen's bindings are
          # generated against libvips 8.18, and 24.04 only has 8.15
          - os: ubuntu-26.04
            shell: bash
          - os: ubuntu-26.04-arm
            shell: bash
          - os: macos-latest
            shell: bash
          - os: windows-latest
            shell: 'msys2 {0}'
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # debian/ubuntu ship libheif without any codec, so heic/avif need the
      # plugin packages on top -- brew's and msys2's libheif bundle theirs.
      # blitz links fontconfig and freetype directly; libvips-dev happens to
      # pull both in, but blitz is the one that needs them
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libvips-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libheif-plugin-libde265 \
            libheif-plugin-x265 \
            libheif-plugin-aomdec \
            libheif-plugin-aomenc

      # the external commands that the decoders run. A test fails when one of
      # them is missing (D12), so every runner installs what it has a
      # package for, and ivcmd/decode_test.go names the rest
      - name: Install decoder commands (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libreoffice-writer \
            binwalk \
            calibre \
            libgxps-utils \
            poppler-utils

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --quiet vips
          command -v pkg-config >/dev/null || brew install --quiet pkgconf

      # LibreOffice and calibre are casks, which install an app rather than a
      # command, so the folder of each command goes on the path
      - name: Install decoder commands (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --quiet ffmpeg binwalk libgxps poppler
          brew install --quiet --cask libreoffice calibre
          echo /Applications/LibreOffice.app/Contents/MacOS >> "$GITHUB_PATH"
          echo /Applications/calibre.app/Contents/MacOS >> "$GITHUB_PATH"

      # UCRT64 rather than MINGW64: the mupdf of go-fitz called
      # __intrinsic_setjmpex, which only ucrt has. go-fitz is gone, and
      # MINGW64 is untested since (see docs/BACKLOG.md)
      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # keep the runner's PATH so the Go installed below stays visible
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libvips
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-libgxps
            mingw-w64-ucrt-x86_64-poppler

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Versions
        run: |
          go version
          go env CC CGO_ENABLED
          pkg-config --modversion vips

      - name: Build
        run: |
          go build ./...

      - name: Vet
        run: |
          go vet ./...

      - name: Test
        run: |
          go test -race -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # libvips and the libraries of blitz are cgo, and the linter type
      # checks the packages that link them
      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libvips-dev \
            libfontconfig-dev \
            libfreetype-dev

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # pinned, because .golangci.yml sets `default: all`, and a newer release
      # can enable a linter that nobody chose
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Lint
        run: golangci-lint run ./...

